; Mochi v1 — robot organizador con personalidad
; Placa: Waveshare ESP32-S3-Touch-LCD-1.28
;
; Para compilar: instala VS Code + extensión PlatformIO, abre esta carpeta
; y presiona "Upload" (flecha →) en la barra inferior.

[env:mochi]
platform = espressif32 @ ^6.6.0          ; Arduino core 2.0.x (compatible con TFT_eSPI)
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_qspi   ; PSRAM de 2 MB (quad)

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bblanchon/ArduinoJson @ ^7.0.4

build_flags =
    -DBOARD_HAS_PSRAM
    ; ---- Configuración de la pantalla GC9A01 (pines de la placa Waveshare Touch) ----
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MISO=12
    -DTFT_MOSI=11
    -DTFT_SCLK=10
    -DTFT_CS=9
    -DTFT_DC=8
    -DTFT_RST=14
    -DTFT_BL=2
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_FSPI_PORT=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=80000000
